name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: Self-test (Python ${{ matrix.python }})
    # Pinned: setup-python has no Python 3.9 for Ubuntu 26.04 (ubuntu-latest), and 3.9 is the
    # oldest version the README supports.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest
      - name: Run end-to-end gate self-test
        run: PYTHON=python bash tests/selftest.sh

  validate:
    name: Validate plugin + marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict ./plugins/light-harness

  guard-windows:
    name: Hook launcher on Windows (Git Bash)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harness leaves the repo untouched; guard is inert outside harness repos and blocks pre-approval edits inside them
        run: |
          P="$PWD/plugins/light-harness"; G="$P/scripts/guard.sh"
          T="$(cygpath -m "$(mktemp -d)")"
          for d in plain proj; do
            git init -q "$T/$d"; git -C "$T/$d" -c user.name=ci -c user.email=ci@ci commit -q --allow-empty -m init
          done
          (cd "$T/proj" && sh "$P/bin/light-harness" start-task ci)
          payload() { printf '{"tool_name":"Write","cwd":"%s","tool_input":{"file_path":"%s/x.py","content":"x"}}' "$1" "$2"; }
          set +e
          payload "$T/plain" "$T/plain" | CLAUDE_PROJECT_DIR="$T/plain" sh "$G"; A=$?
          payload "$T/proj" "$T/proj/.tasks/ci" | CLAUDE_PROJECT_DIR="$T/proj" sh "$G"; B=$?
          set -e
          echo "outside harness: exit $A (want 0) | inside a Draft task: exit $B (want 2)"
          test "$A" -eq 0 && test "$B" -eq 2
          test -z "$(git -C "$T/proj" status --porcelain)"
          test "$(git -C "$T/proj" rev-parse task/ci)" = "$(git -C "$T/proj" rev-parse HEAD)"
          grep -q '"command":"start-task","ok":true' "$T/proj/.git/light-harness/telemetry/events.jsonl"
          grep -q '"rule":"stage"' "$T/proj/.git/light-harness/telemetry/events.jsonl"
